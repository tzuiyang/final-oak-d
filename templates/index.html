<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OAK-D Follow Demo</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  .wrap {
    display: inline-block;
    position: relative;
    border: 1px solid #333;
    background: #000;
  }
  #stream {
    display: block;
    max-width: 100%;
    cursor: crosshair;
  }
  .bar {
    margin-top: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .pill {
    padding: 4px 10px;
    border-radius: 4px;
    background: #222;
    border: 1px solid #333;
  }
  .pill.ok { color: #6f6; border-color: #3a6; }
  .pill.err { color: #f88; border-color: #844; }
  button {
    font: inherit;
    padding: 5px 12px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #2a2a2a; }
  button.target {
    background: #1a3a1a;
    border-color: #3a6;
    color: #cfc;
  }
  button.target:hover { background: #2a4a2a; }
  button.target.engaged {
    background: #2d6a2d;
    border-color: #5c5;
    color: #fff;
  }
  #targets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    max-width: 900px;
  }
  #targets:empty::before {
    content: "(no objects detected yet)";
    color: #666;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>OAK-D follow demo — click a button below or click an object in the stream to follow</h1>
  <div class="wrap">
    <img id="stream" alt="OAK-D stream">
  </div>
  <div class="bar">
    <span id="mode" class="pill">mode: ?</span>
    <span id="status" class="pill">standing still</span>
    <span id="path" class="pill">depth: waiting</span>
    <button id="stopBtn">stop</button>
    <span id="error" class="pill err" style="display:none"></span>
  </div>
  <div id="targets"></div>
  <div class="hint">Tip: buttons above are the most reliable way to select. Green outline = currently engaged.</div>

<script>
  const img = document.getElementById('stream');
  const statusEl = document.getElementById('status');
  const pathEl = document.getElementById('path');
  const errorEl = document.getElementById('error');
  const stopBtn = document.getElementById('stopBtn');
  const targetsEl = document.getElementById('targets');
  const modeEl = document.getElementById('mode');
  let engagedClass = '';

  // Self-pacing frame loop: request the next frame only after the previous
  // one finishes loading. If the network is slow, requests slow down too —
  // never an MJPEG-style buildup of stale frames.
  function loadNextFrame() {
    img.src = '/frame.jpg?t=' + Date.now();
  }
  img.addEventListener('load', () => setTimeout(loadNextFrame, 60));
  img.addEventListener('error', () => setTimeout(loadNextFrame, 200));
  loadNextFrame();

  async function selectClass(name) {
    await fetch('/select_class', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({class_name: name}),
    });
    setStatus(`requested: ${name}`, 'ok');
  }

  function renderTargets(detections) {
    const byClass = new Map();
    for (const d of detections || []) {
      const cur = byClass.get(d.class_name);
      if (!cur || d.distance < cur.distance) byClass.set(d.class_name, d);
    }
    const list = Array.from(byClass.values()).sort((a, b) => a.distance - b.distance);
    while (targetsEl.firstChild) targetsEl.removeChild(targetsEl.firstChild);
    for (const d of list) {
      const btn = document.createElement('button');
      btn.className = 'target' + (d.class_name === engagedClass ? ' engaged' : '');
      btn.textContent = `${d.class_name} ${Number(d.distance).toFixed(2)}m`;
      btn.addEventListener('click', () => selectClass(d.class_name));
      targetsEl.appendChild(btn);
    }
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.classList.remove('ok', 'err');
    if (kind) statusEl.classList.add(kind);
  }

  img.addEventListener('click', async (ev) => {
    const r = img.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width;
    const y = (ev.clientY - r.top) / r.height;
    const res = await fetch('/select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({x, y}),
    });
    const body = await res.json();
    if (body.disengaged) {
      engagedClass = '';
      setStatus('stopped (no object at click)');
    } else if (body.ok) {
      engagedClass = body.class_name;
      setStatus(`requested: ${body.class_name}`, 'ok');
    }
  });

  stopBtn.addEventListener('click', async () => {
    await fetch('/disengage', {method: 'POST'});
    engagedClass = '';
    setStatus('stopped');
  });

  async function pollState() {
    try {
      const r = await fetch('/state');
      const s = await r.json();
      const p = s.path_clear || {};
      if (p.valid && p.nearest_obstacle_m !== null && p.nearest_obstacle_m !== undefined) {
        pathEl.textContent = `depth: ${Number(p.nearest_obstacle_m).toFixed(2)}m`;
        pathEl.classList.add('ok');
        pathEl.classList.remove('err');
      } else {
        pathEl.textContent = `depth: ${p.reason || 'waiting'}`;
        pathEl.classList.add('err');
        pathEl.classList.remove('ok');
      }
      if (s.error) {
        errorEl.style.display = '';
        errorEl.textContent = s.error;
      } else {
        errorEl.style.display = 'none';
      }
      const mode = s.mode || 'AUTO';
      modeEl.textContent = `mode: ${mode}`;
      modeEl.classList.remove('ok', 'err');
      modeEl.classList.add(mode === 'MANUAL' ? 'err' : 'ok');
      renderTargets(s.detections);
    } catch (e) { /* transient; retry next tick */ }
  }
  setInterval(pollState, 500);
  pollState();
</script>
</body>
</html>
