object_follower:
  ros__parameters:
    # Path to the YOLO blob — relative paths are resolved from the node's script dir.
    model_blob_path: "models/yolov8n_coco_640x352.blob"

    # Stop when the target is within this distance (meters). 1.0 m is a
    # comfortable trailing distance for following a person — close enough
    # to keep tracking, far enough not to step on their heels.
    target_distance: 1.0

    # Proportional gains
    k_forward: 0.8
    k_yaw: 1.2

    # Output clamps (keep modest so the default walking policy stays stable)
    max_forward_vel: 0.5
    max_yaw_vel: 1.5

    # Stop if we lose the target for this many consecutive frames. With
    # YOLO running at ~15 fps, 30 frames ≈ 2 s of grace before the follower
    # zeroes out — long enough to ride through normal detection flicker
    # without abandoning the target.
    timeout_frames: 30

    # The Pi's modified upstream launch removed cmd_vel_mux and has
    # teleop_twist_joy publish straight to /cmd_vel; the neural_controller
    # also subscribes there. We follow the same convention. Our follower
    # only publishes while a target is engaged, so it shares the topic with
    # teleop without a mux — most-recent-publisher wins. If you redeploy
    # against a stock upstream that *does* run cmd_vel_mux, change this back
    # to /person_following_cmd_vel for proper teleop priority.
    cmd_vel_topic: "/cmd_vel"

    # Set true if the OAK-D is mounted upside-down. Rotates all three cameras
    # 180° and swaps the stereo correspondence so depth still works.
    camera_flipped: true

    # Throttle cmd_vel publishing. The walking policy needs steady input to
    # hold a gait — too sparse and the robot just twitches in place. 10 Hz
    # is plenty smooth without flooding the bus.
    command_period_s: 0.1

    # /joy.buttons index for AUTO/MANUAL toggle. On this Pi's hid-playstation
    # mapping, button 3 = Square. Avoid 0,1 (gait switch), 9 (activate),
    # 12 (E-stop / R3). Verify with `ros2 topic echo /joy --once` if remapping.
    mode_toggle_button: 3

    # Depth ROI used for generic obstacle checks. Coordinates are normalized
    # image ratios; the ROI is a forward corridor in the aligned depth frame.
    depth_corridor_width_ratio: 0.35
    depth_corridor_ymin: 0.35
    depth_corridor_ymax: 0.80
    min_valid_depth_m: 0.15
    max_valid_depth_m: 5.0
    depth_block_percentile: 10.0

mission_controller:
  ros__parameters:
    # Angular half-width (radians) of the "path corridor" checked for obstacles.
    corridor_half_width_rad: 0.25

    # How much closer than the target an object must be (meters) to count as blocking.
    obstacle_clearance_m: 0.2

    # How often the "standing still — visible: ..." menu is logged.
    print_period_s: 2.0

    # How often the path-clear check is re-evaluated.
    evaluate_period_s: 0.2

    # Whether to run the depth-corridor obstacle check at all. Off by default:
    # the OAK-D's near-field depth tends to read the floor in front of the bot
    # (≈0.3–0.5 m) and flag it as an obstacle. Re-enable once the ROI is
    # tuned (depth_corridor_ymax in object_follower) to clear the floor.
    enable_depth_path_check: false

    # Only used when enable_depth_path_check is true. Fail closed if depth
    # is unavailable or invalid (no frames, all NaNs, etc.).
    require_depth_path_check: true

web_ui:
  ros__parameters:
    # Flask bind address. "0.0.0.0" exposes on all interfaces; use the Pi's
    # LAN IP from a laptop browser. Use "127.0.0.1" to restrict to the Pi.
    host: "0.0.0.0"
    port: 8080
